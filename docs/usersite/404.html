<title>Morning Brief</title>
<meta name="robots" content="noindex, nofollow">
<script>
/* 짧은 날짜 주소 지원: /2026-09-11 → 그날 브리핑, 그 외 경로 → 최신 브리핑 */
(function () {
  var base = "https://mctaki23-glitch.github.io/morning_brief/";
  var m = location.pathname.match(/^\/(\d{4}-\d{2}-\d{2})\/?$/);
  location.replace(m ? base + "brief/" + m[1] + "/" + location.hash : base + location.hash);
})();
</script>

body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FFFFFF;color:#3D3D3D;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:17px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;background:#F58220}
a{color:#043B72}
</style>
</head>
