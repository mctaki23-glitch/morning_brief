name: Probe price sources

# 수동 실행 전용: 러너에서 어떤 시세 소스가 응답하는지 점검한다 (사이트·아카이브는 건드리지 않음).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe
        run: python scripts/probe_sources.py
