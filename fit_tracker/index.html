/* ---------- 토큰: 라이트(기본) ---------- */
:root{
  color-scheme: light;
  --bg:#f4f3ef; --card:#fcfcfb; --card2:#efeee8;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --line:#e1e0d9; --line2:#c9c7bf;
  --cat-m:#eb6834; --cat-e:#4a3aa7; --cat-c:#1baf7a; --cat-n:#eda100;
  --on-m:#ffffff;  --on-e:#ffffff;  --on-c:#002a1c;  --on-n:#1c1500;
  --ok:#0ca30c; --warn:#b26a00; --err:#d03b3b;
  --stamp:#0b0b0b; --on-stamp:#fcfcfb;
  --ring:rgba(11,11,11,.10);
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 4px 14px rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f0f0e; --card:#1a1a19; --card2:#232322;
    --ink:#f4f4f0; --ink2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --line2:#3d3c38;
    --cat-m:#d95926; --cat-e:#9085e9; --cat-c:#199e70; --cat-n:#c98500;
    --on-m:#ffffff;  --on-e:#191338;  --on-c:#ffffff;  --on-n:#211600;
    --ok:#0ca30c; --warn:#fab219; --err:#e66767;
    --stamp:#f4f4f0; --on-stamp:#0f0f0e;
    --ring:rgba(255,255,255,.10);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f0f0e; --card:#1a1a19; --card2:#232322;
  --ink:#f4f4f0; --ink2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --line2:#3d3c38;
  --cat-m:#d95926; --cat-e:#9085e9; --cat-c:#199e70; --cat-n:#c98500;
  --on-m:#ffffff;  --on-e:#191338;  --on-c:#ffffff;  --on-n:#211600;
  --ok:#0ca30c; --warn:#fab219; --err:#e66767;
  --stamp:#f4f4f0; --on-stamp:#0f0f0e;
  --ring:rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
}

/* ---------- 기본 ---------- */
*{box-sizing:border-box; margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
.disp{font-family:"Black Han Sans","IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif; font-weight:400; letter-spacing:.01em}
.wrap{max-width:600px; margin:0 auto; padding:18px 16px calc(104px + env(safe-area-inset-bottom))}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
:focus-visible{outline:2px solid var(--cat-e); outline-offset:2px; border-radius:6px}

/* ---------- 헤더 ---------- */
.top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:4px}
.brand{font-size:12px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.savechip{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink2); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 10px; white-space:nowrap}
.savechip .dot{width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none}
.savechip[data-s="synced"] .dot{background:var(--ok)}
.savechip[data-s="saving"] .dot{background:var(--warn); animation:pulse 1.1s ease-in-out infinite}
.savechip[data-s="error"] .dot{background:var(--err)}
@keyframes pulse{50%{opacity:.35}}
.dateline{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-top:2px}
.bigdate{font-size:34px; line-height:1.15}
.daytag{font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; border:1px solid var(--line2); color:var(--ink2)}
.streakchip{display:inline-flex; align-items:baseline; gap:4px; font-size:13px; color:var(--ink2)}
.streakchip b{font-size:20px; line-height:1; color:var(--ink)}

/* ---------- 진행 바 ---------- */
.prog{margin:14px 0 18px}
.prog-head{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--ink2); margin-bottom:6px}
.prog-head b{color:var(--ink); font-variant-numeric:tabular-nums}
.prog-track{height:8px; border-radius:99px; background:var(--card2); overflow:hidden}
.prog-fill{height:100%; border-radius:99px; background:var(--ink); transition:width .35s ease; min-width:0}

/* ---------- 카드/섹션 ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden}
.sec-head{display:flex; align-items:flex-start; gap:9px; padding:13px 15px 10px}
.sec-dot{width:9px; height:9px; border-radius:50%; flex:none; box-shadow:0 0 0 1px var(--ring); margin-top:6px}
.sec-title{flex:1; min-width:0}
.sec-name{font-size:16px; font-weight:700; margin-right:6px}
.sec-title small{display:block; font-size:12px; font-weight:500; color:var(--muted)}
.sec-count{font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums}
.opt-tag{font-size:11px; font-weight:700; color:var(--ink2); border:1px solid var(--line2); border-radius:6px; padding:1px 6px}

/* ---------- 체크 행 ---------- */
.row{display:flex; align-items:center; gap:12px; padding:12px 15px; border-top:1px solid var(--line); cursor:pointer; user-select:none; -webkit-user-select:none}
.row:active .box{transform:scale(.9)}
.box{width:27px; height:27px; border-radius:50%; border:2px solid var(--line2); flex:none; display:grid; place-items:center; transition:transform .15s ease, background .15s ease, border-color .15s ease; background:transparent}
.box svg{width:15px; height:15px; opacity:0; transform:scale(.6); transition:opacity .15s, transform .15s}
.row[aria-checked="true"] .box svg{opacity:1; transform:scale(1)}
.row[aria-checked="true"] .box.b-m{background:var(--cat-m); border-color:var(--cat-m); color:var(--on-m)}
.row[aria-checked="true"] .box.b-e{background:var(--cat-e); border-color:var(--cat-e); color:var(--on-e)}
.row[aria-checked="true"] .box.b-c{background:var(--cat-c); border-color:var(--cat-c); color:var(--on-c)}
.row[aria-checked="true"] .box.b-n{background:var(--cat-n); border-color:var(--cat-n); color:var(--on-n)}
.row-main{flex:1; min-width:0}
.row-name{font-weight:500; transition:color .15s}
.row-sub{display:block; font-size:12px; color:var(--muted)}
.row-vol{font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right}
.row[aria-checked="true"] .row-name{color:var(--muted); text-decoration:line-through; text-decoration-thickness:1px}
.row[aria-disabled="true"]{opacity:.45; cursor:default}

/* ---------- 조깅 카드 ---------- */
.km-line{display:flex; align-items:center; gap:8px; padding:0 15px 13px 54px; flex-wrap:wrap}
.km-line label{font-size:12px; color:var(--ink2)}
.km-input{width:76px; padding:6px 8px; border:1px solid var(--line2); border-radius:9px; background:var(--card); color:var(--ink); font:inherit; font-variant-numeric:tabular-nums}
.week-chip{font-size:12px; color:var(--ink2); background:var(--card2); padding:3px 9px; border-radius:999px}
.guide{border-top:1px solid var(--line)}
.guide summary{padding:10px 15px; font-size:13px; color:var(--ink2); cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"▾"; margin-left:auto; color:var(--muted); transition:transform .2s}
.guide[open] summary::after{transform:rotate(180deg)}
.guide-body{padding:2px 15px 13px; font-size:13px; color:var(--ink2)}
.guide-body li{margin:4px 0 4px 18px}
.guide-body b{color:var(--ink)}

/* ---------- 스탬프/버튼 ---------- */
.stamp-line{display:flex; align-items:center; gap:12px; margin:2px 0 16px}
.stamp{width:74px; height:74px; border-radius:50%; background:var(--stamp); color:var(--on-stamp); display:grid; place-items:center; font-size:21px; transform:rotate(-8deg); flex:none; animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.5) rotate(-30deg); opacity:0} 100%{transform:scale(1) rotate(-8deg); opacity:1}}
.stamp-msg{font-size:14px; color:var(--ink2)}
.stamp-msg b{color:var(--ink)}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:13px; border-radius:13px; font-weight:700; font-size:15px; border:1.5px solid var(--ink); color:var(--ink); background:transparent; text-decoration:none; transition:opacity .15s}
.btn:active{opacity:.6}
.btn.primary{background:var(--ink); color:var(--card)}
.btn[aria-disabled="true"]{opacity:.35; pointer-events:none}
.btn-note{font-size:12px; color:var(--muted); text-align:center; margin-top:8px}
.coach{font-size:13px; color:var(--muted); text-align:center; margin:22px 0 4px}

/* ---------- 통계 타일 ---------- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
.tile{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow)}
.tile .t-num{font-size:27px; line-height:1.2}
.tile .t-num small{font-size:14px}
.tile .t-lab{font-size:12px; color:var(--ink2)}
.tile .t-sub{font-size:11px; color:var(--muted)}

/* ---------- 캘린더 ---------- */
.cal-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
.cal-nav .disp{font-size:21px}
.nav-btn{width:38px; height:38px; border-radius:11px; border:1px solid var(--line); background:var(--card); font-size:16px; color:var(--ink2)}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.dow{font-size:11px; color:var(--muted); text-align:center; padding:4px 0}
.dow.sun{color:var(--err)}
.cell{aspect-ratio:.92; border-radius:11px; border:1px solid transparent; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:5px; gap:3px; background:transparent; position:relative}
.cell.in{background:var(--card); border-color:var(--line)}
.cell.wknd.in{background:var(--card2)}
.cell.today{border-color:var(--ink); border-width:1.5px}
.cell.sel{outline:2px solid var(--cat-e); outline-offset:1px}

<script>
"use strict";
/* 페이지의 원본 마크업을 렌더 전에 확보해 둔다 — 저장 시 이 원본에 최신 기록을
   심어 완전한 교체 페이지를 만들어 게시한다 (라이브 DOM 직렬화 금지 원칙). */
const SRC0 = document.body.innerHTML;
/* ================= 계획 데이터 (계획서 원문 기반) ================= */
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5l3.6 3.6L13.5 4.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const SECTIONS = [
  { key:'m', icon:'🌅', title:'아침 루틴', sub:'출근 전 3분 · 자세 정렬 & 펌핑', items:[
    { id:'m1', name:'정석 푸쉬업', vol:'15회 × 1세트', sub:'가슴 · 앞어깨' },
    { id:'m2', name:'3kg 오버헤드 W-레이즈', vol:'15회 × 2세트', sub:'뒤어깨 · 등 상부(능형근)' },
  ]},
  { key:'e', icon:'🌙', title:'저녁 루틴', sub:'퇴근 후 12분 · 8kg 중량 & 프레임 타격', items:[
    { id:'e1', name:'8kg 원암 덤벨 로우 🥇', vol:'각 10~12회 × 3세트', sub:'광배근 · 등' },
    { id:'e2', name:'3kg 사이드 레터럴 레이즈 🥈', vol:'15회 × 2~3세트', sub:'옆어깨' },
    { id:'e3', name:'8kg 덤벨 이두 컬 🥉', vol:'각 10회 × 2세트', sub:'이두' },
  ]},
  { key:'c', icon:'🏃', title:'슬로우 조깅', sub:'주 2~3회 · 3.0~4.0km · 25~35분', items:[
    { id:'c1', name:'슬로우 조깅', vol:'3.0~4.0km', sub:'Zone 2 · FatMax 유산소' },
  ]},
  { key:'n', icon:'🥗', title:'식단 체크', sub:'하루 영양 체크리스트', items:[
    { id:'n1', name:'아침 — 가벼운 자연식', vol:'', sub:'계란 1~2개 + 바나나/하루견과 + 올레샷 1스푼' },
    { id:'n2', name:'점심 — 일반식 밥 반 공기 + 단백질 음료 23g', vol:'', sub:'식후 50분 속보' },
    { id:'n3', name:'저녁 — 닭가슴살 샐러드 + 방울토마토 7개', vol:'', sub:'수면 중 체지방 연소 유도' },
  ]},
];
const STRENGTH = ['m1','m2','e1','e2','e3'];
const DIET = ['n1','n2','n3'];
const ITEM_NAME = {};
SECTIONS.forEach(s => s.items.forEach(it => ITEM_NAME[it.id] = it.name));
const CAT_LABEL = { m:'아침', e:'저녁', c:'조깅', n:'식단' };

/* ================= 상태 ================= */
let S = { version:1, days:{} };      // days[key] = {m1:1,…,c1:1,km:3.5,n1:1,…,u:ms}
let art = null;                       // artifact 네임스페이스
let downloadsNS = null;
let permanentLocal = false;           // 파일 저장이 불가능하다고 판명됨
let localStatus = 'local';            // permanentLocal일 때 표시할 상태
let conflictRetried = false;
let saveTimer = null, retryTimer = null;
let viewTab = 'today';
let calY, calM;                       // 캘린더에서 보고 있는 연/월
let selKey = null;                    // 캘린더에서 선택한 날

const LS_KEY = 'ounwan_v1';
const SS_KEY = 'ounwan_pending_v1';
const UI_KEY = 'ounwan_ui_v1';

/* ================= 날짜 유틸 ================= */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => keyOf(new Date());
const isWeekend = k => { const w = parseKey(k).getDay(); return w === 0 || w === 6; };
const DOW_KO = ['일','월','화','수','목','금','토'];

/* ================= 기록 접근 ================= */
const day = k => S.days[k] || {};
function dayDone(k){
  const d = day(k);
  return {
    m: !!(d.m1 && d.m2), mAny: !!(d.m1 || d.m2),
    e: !!(d.e1 && d.e2 && d.e3), eAny: !!(d.e1 || d.e2 || d.e3),
    c: !!d.c1,
    n: DIET.every(id => d[id]), nAny: DIET.some(id => d[id]),
    nCnt: DIET.filter(id => d[id]).length,
    strength: STRENGTH.every(id => d[id]),
    any: STRENGTH.some(id => d[id]) || !!d.c1 || DIET.some(id => d[id]),
  };
}
/* 그날의 훈련 목표 달성: 평일=근력 5종, 주말=조깅(휴식일 보너스) */
const isComplete = k => isWeekend(k) ? dayDone(k).c : dayDone(k).strength;

function setDay(k, patch){
  const cleaned = cleanDay({ ...day(k), ...patch, u: Date.now() });
  const hasContent = cleaned && (STRENGTH.concat(DIET, ['c1']).some(id => cleaned[id]) || cleaned.km > 0);
  if (!hasContent) delete S.days[k]; else S.days[k] = cleaned;
  writeLS();
  scheduleSave();
  render();
}

/* ================= 통계 ================= */
function streak(){
  const d = new Date(); let n = 0, guard = 0;
  if (!isComplete(keyOf(d))) d.setDate(d.getDate()-1);   // 오늘 미완료면 어제부터
  while (guard++ < 400){
    const k = keyOf(d), w = d.getDay();
    if (w === 0 || w === 6){                              // 주말: 스트릭 유지(카운트 제외)
      d.setDate(d.getDate()-1); continue;
    }
    if (isComplete(k)) { n++; d.setDate(d.getDate()-1); }
    else break;
  }
  return n;
}
function weekCardio(){
  const now = new Date();
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay()+6)%7));
  let cnt = 0, km = 0;
  for (let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const rec = day(keyOf(d));
    if (rec.c1){ cnt++; km += (+rec.km || 0); }
  }
  return { cnt, km };
}
function monthStats(y, m){
  let train = 0, jog = 0, jogKm = 0;
  const last = new Date(y, m+1, 0).getDate();
  for (let dd=1; dd<=last; dd++){
    const k = y + '-' + pad(m+1) + '-' + pad(dd);
    if (!isWeekend(k) && dayDone(k).strength) train++;
    if (day(k).c1){ jog++; jogKm += (+day(k).km || 0); }
  }
  return { train, jog, jogKm };
}

/* ================= 구글 캘린더 링크 ================= */
function gcalUrl(k){
  const d = day(k), st = dayDone(k);
  const parts = [];
  if (st.m) parts.push('아침'); if (st.e) parts.push('저녁');
  if (st.c) parts.push('조깅' + (d.km > 0 ? ' ' + d.km + 'km' : ''));
  if (st.nCnt) parts.push('식단 ' + st.nCnt + '/' + DIET.length);
  const title = '💪 오운완 — ' + (parts.length ? parts.join(' · ') : '운동 기록');
  const lines = ['[오운완 체크 · 훈련 일지]', ''];
  SECTIONS.forEach(s => {
    lines.push(s.icon + ' ' + s.title);
    s.items.forEach(it => {
      let line = (d[it.id] ? '✅ ' : '⬜ ') + it.name;
      if (it.id === 'c1' && d.km > 0) line += ' (' + d.km + 'km)';
      lines.push(line);
    });
    lines.push('');
  });
  lines.push('🔥 연속 달성 ' + streak() + '일');
  const next = parseKey(k); next.setDate(next.getDate()+1);
  const dates = k.replace(/-/g,'') + '/' + keyOf(next).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(title)
    + '&dates=' + dates
    + '&details=' + encodeURIComponent(lines.join('\n'));
}

/* ================= 렌더 ================= */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function rowHTML(k, it, cat, disabled){
  const checked = !!day(k)[it.id];
  return '<div class="row" role="checkbox" tabindex="0" aria-checked="' + checked + '"'
    + (disabled ? ' aria-disabled="true"' : ' data-act="toggle"')
    + ' data-date="' + k + '" data-id="' + it.id + '">'
    + '<span class="box b-' + cat + '">' + CHECK + '</span>'
    + '<span class="row-main"><span class="row-name">' + esc(it.name) + '</span>'
    + (it.sub ? '<span class="row-sub">' + esc(it.sub) + '</span>' : '') + '</span>'
    + (it.vol ? '<span class="row-vol">' + esc(it.vol) + '</span>' : '')
    + '</div>';
}

function sectionHTML(k, s, opts){
  const d = day(k);
  const done = s.items.filter(it => d[it.id]).length;
  const optional = opts && opts.optional;
  let h = '<div class="card"><div class="sec-head">'
    + '<span class="sec-dot" style="background:var(--cat-' + s.key + ')"></span>'
    + '<div class="sec-title"><span class="sec-name">' + s.icon + ' ' + esc(s.title) + '</span>'
    + (optional ? '<span class="opt-tag">선택</span>' : '')
    + '<small>' + esc(s.sub) + '</small></div>'
    + '<span class="sec-count">' + done + '/' + s.items.length + '</span></div>';
  h += s.items.map(it => rowHTML(k, it, s.key, opts && opts.disabled)).join('');
  if (s.key === 'c'){
    const wk = weekCardio();
    h += '<div class="km-line"><label for="km-' + k + '">거리</label>'
      + '<input class="km-input" id="km-' + k + '" type="number" inputmode="decimal" step="0.1" min="0" max="99"'
      + ' placeholder="3.5" value="' + (d.km > 0 ? d.km : '') + '" data-act="km" data-date="' + k + '"> km'
      + '<span class="week-chip">이번 주 ' + wk.cnt + '/2~3회' + (wk.km > 0 ? ' · ' + (Math.round(wk.km*10)/10) + 'km' : '') + '</span></div>';
    h += '<details class="guide"><summary>조깅 가이드 보기</summary><ul class="guide-body">'
      + '<li>페이스 <b>8\'20"~8\'40"/km</b> — 대화 가능한 속도</li>'
      + '<li>심박수 <b>Zone 2 (132~143 BPM)</b> 철저 준수, <b>150 BPM 초과 금지</b></li>'
      + '<li>케이던스 <b>168~172 SPM</b> (발 잘게 쪼개기)</li>'
      + '<li>수직 진폭 <b>8.8cm 이하</b> 유지</li>'
      + '<li>목적: 순수 체지방 산화(FatMax) &amp; 관절 무리 없는 유산소</li></ul></details>';
  }
  return h + '</div>';
}

function renderToday(){
  const k = todayKey();
  const wknd = isWeekend(k);
  const st = dayDone(k);
  const targets = wknd ? DIET.concat(['c1']) : STRENGTH.concat(DIET);
  const doneCnt = targets.filter(id => day(k)[id]).length;
  const pct = targets.length ? Math.round(doneCnt / targets.length * 100) : 0;

  let h = '';
  if (wknd) h += '<div class="banner">🛌 주말은 <b>회복일</b> — 슬로우 조깅 또는 완전 휴식을 권장해요. 근력 루틴은 선택입니다.</div>';

  h += '<div class="prog"><div class="prog-head"><span>오늘 체크</span><b>' + doneCnt + '/' + targets.length + ' · ' + pct + '%</b></div>'
    + '<div class="prog-track"><div class="prog-fill" style="width:' + pct + '%"></div></div></div>';

  if (wknd ? st.c : st.strength){
    h += '<div class="stamp-line"><div class="stamp disp">오운완</div>'
      + '<div class="stamp-msg"><b>오늘 운동 완료!</b><br>아래 버튼으로 캘린더에 남겨두세요.</div></div>';
  }

  h += sectionHTML(k, SECTIONS[0], { optional: wknd });
  h += sectionHTML(k, SECTIONS[1], { optional: wknd });
  h += sectionHTML(k, SECTIONS[2], { optional: !wknd });
  h += sectionHTML(k, SECTIONS[3]);

  const enabled = st.any;
  h += '<a class="btn primary" ' + (enabled ? 'href="' + gcalUrl(k) + '" target="_blank" rel="noopener noreferrer"' : 'aria-disabled="true"') + '>📅 오늘 기록을 구글 캘린더에 저장</a>'
    + '<div class="btn-note">' + (enabled ? '구글 캘린더가 열리면 저장 버튼 한 번만 누르면 돼요.' : '항목을 하나라도 체크하면 캘린더에 기록할 수 있어요.') + '</div>';

  h += '<div class="coach">완벽보다 꾸준함 — 오늘 몫만 하면 됩니다 🔥</div>';
  document.getElementById('view-today').innerHTML = h;
}

function calCellHTML(y, m, dd, tk){
  const k = y + '-' + pad(m+1) + '-' + pad(dd);
  const st = dayDone(k);
  const future = k > tk;
  const cls = ['cell','in'];
  if (isWeekend(k)) cls.push('wknd');
  if (k === tk) cls.push('today');
  if (k === selKey) cls.push('sel');
  if (isComplete(k) && !future) cls.push('done');
  if (future) cls.push('future');
  const dot = (on, half, c) => '<i class="d-' + c + (on ? '' : half ? ' half' : ' off') + '"></i>';
  return '<button class="' + cls.join(' ') + '" data-act="pick" data-date="' + k + '"'
    + (future ? ' aria-disabled="true"' : '') + ' aria-label="' + m1label(k) + '">'
    + '<span class="c-num">' + dd + '</span>'
    + '<span class="c-dots">'
    + dot(st.m, st.mAny, 'm') + dot(st.e, st.eAny, 'e') + dot(st.c, false, 'c') + dot(st.n, st.nAny, 'n')
    + '</span></button>';
}
function m1label(k){
  const d = parseKey(k);
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + DOW_KO[d.getDay()] + '요일';
}

function renderCal(){
  const tk = todayKey();
  const now = new Date();
  const ms = monthStats(now.getFullYear(), now.getMonth());
  const wk = weekCardio();

  let h = '<div class="tiles">'
    + '<div class="tile"><div class="t-num disp">🔥 ' + streak() + '<small>일</small></div><div class="t-lab">연속 달성</div><div class="t-sub">평일 근력 기준 · 주말 제외</div></div>'
    + '<div class="tile"><div class="t-num disp">' + ms.train + '<small>일</small></div><div class="t-lab">이번 달 훈련일</div><div class="t-sub">아침+저녁 루틴 완료</div></div>'
    + '<div class="tile"><div class="t-num disp">' + wk.cnt + '<small>/2~3회</small></div><div class="t-lab">이번 주 조깅</div><div class="t-sub">' + (wk.km > 0 ? (Math.round(wk.km*10)/10) + 'km 달림' : '주 2~3회 목표') + '</div></div>'
    + '<div class="tile"><div class="t-num disp">' + (Math.round(ms.jogKm*10)/10) + '<small>km</small></div><div class="t-lab">이번 달 조깅 거리</div><div class="t-sub">' + ms.jog + '회 실시</div></div>'
    + '</div>';

  h += '<div class="cal-nav"><button class="nav-btn" data-act="mon" data-dir="-1" aria-label="이전 달">‹</button>'
    + '<span class="disp">' + calY + '년 ' + (calM+1) + '월</span>'
    + '<button class="nav-btn" data-act="mon" data-dir="1" aria-label="다음 달">›</button></div>';

  h += '<div class="cal-grid">';
  DOW_KO.forEach((d,i) => h += '<div class="dow' + (i===0 ? ' sun' : '') + '">' + d + '</div>');
  const first = new Date(calY, calM, 1).getDay();
  const last = new Date(calY, calM+1, 0).getDate();
  for (let i=0;i<first;i++) h += '<div class="cell"></div>';
  for (let dd=1; dd<=last; dd++) h += calCellHTML(calY, calM, dd, tk);
  h += '</div>';

  h += '<div class="legend">'
    + '<span><i class="d-m"></i>아침</span><span><i class="d-e"></i>저녁</span>'
    + '<span><i class="d-c"></i>조깅</span><span><i class="d-n"></i>식단</span>'
    + '<span><span class="stampkey"></span>목표 달성</span></div>';

  if (selKey){
    const d = parseKey(selKey);
    const wknd = isWeekend(selKey);
    h += '<div class="card day-detail"><h3>' + m1label(selKey) + (isComplete(selKey) ? ' · 오운완 ✓' : '') + '</h3>'
      + '<div class="hint">' + (selKey === tk ? '오늘이에요. 아래에서 바로 체크할 수 있어요.' : '지난 기록을 여기서 수정할 수 있어요.') + '</div>';
    SECTIONS.forEach(s => {
      s.items.forEach(it => { h += rowHTML(selKey, it, s.key, false); });
      if (s.key === 'c'){
        h += '<div class="km-line" style="padding-top:8px"><label for="km-' + selKey + '-d">거리</label>'
          + '<input class="km-input" id="km-' + selKey + '-d" type="number" inputmode="decimal" step="0.1" min="0" max="99"'
          + ' placeholder="3.5" value="' + (day(selKey).km > 0 ? day(selKey).km : '') + '" data-act="km" data-date="' + selKey + '"> km</div>';
      }
    });
    h += '<div class="detail-actions"><a class="btn" ' + (dayDone(selKey).any
        ? 'href="' + gcalUrl(selKey) + '" target="_blank" rel="noopener noreferrer"' : 'aria-disabled="true"')
      + '>📅 이 날을 구글 캘린더에 저장</a></div></div>';
  } else {
    h += '<div class="banner" style="text-align:center">날짜를 누르면 그날 기록을 보고 수정할 수 있어요.</div>';
  }

  h += '<details class="data-tools"><summary>⚙️ 데이터 관리</summary><div class="tool-row">'
    + '<button class="tool-btn" data-act="export">파일로 내보내기</button>'
    + '<button class="tool-btn" data-act="copy">JSON 복사</button>'
    + '<button class="tool-btn" data-act="import">가져오기</button>'
    + '<button class="tool-btn danger" data-act="reset">전체 초기화</button>'
    + '</div></details>';

  document.getElementById('view-cal').innerHTML = h;
}

function renderHeader(){
  const now = new Date();
  document.getElementById('bigdate').textContent = (now.getMonth()+1) + '월 ' + now.getDate() + '일 ' + DOW_KO[now.getDay()];
  const wknd = now.getDay() === 0 || now.getDay() === 6;
  document.getElementById('daytag').textContent = wknd ? '회복일' : '훈련일';
  document.getElementById('streaknum').textContent = streak();
}

function render(){
  renderHeader();
  if (viewTab === 'today') renderToday(); else renderCal();
}

/* ================= 저장 상태 칩 ================= */
function setStatus(s){
  const chip = document.getElementById('savechip');
  const txt = document.getElementById('savetext');
  chip.dataset.s = s;
  txt.textContent = ({
    boot:'연결 확인 중…',
    synced:'동기화됨', saving:'저장 중…', local:'이 기기 전용',
    readonly:'읽기 전용', error:'저장 오류', conflict:'다른 기기 변경 반영 중',
  })[s] || s;
  chip.title = ({
    boot:'저장 방식을 확인하고 있어요.',
    synced:'기록이 아티팩트에 저장되어 어느 기기에서나 유지됩니다.',
    saving:'변경 사항을 저장하고 있어요.',
    local:'이 브라우저(localStorage)에만 저장 중입니다.',
    readonly:'이 보기에서는 기록을 수정할 수 없습니다.',
    error:'저장에 실패했어요. 기록은 이 기기에 안전하게 남아 있습니다.',
    conflict:'다른 기기에서 저장된 최신 기록을 불러오는 중입니다.',
  })[s] || '';
}

/* ================= 로컬/세션 스토리지 ================= */
function readLS(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch(e){ return null; } }
function writeLS(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
function readSS(){ try { return JSON.parse(sessionStorage.getItem(SS_KEY)) || null; } catch(e){ return null; } }
function writeSS(){ try { sessionStorage.setItem(SS_KEY, JSON.stringify(S)); } catch(e){} }
function clearSS(){ try { sessionStorage.removeItem(SS_KEY); } catch(e){} }

/* 병합 시 필드 화이트리스트로 정제한다 — 외부에서 가져온 JSON이
   페이지에 내장되므로 임의 문자열이 흘러들지 않게 한다. */
const DAY_FIELDS = ['m1','m2','e1','e2','e3','c1','n1','n2','n3','n4','km','u'];
const KEY_RE = /^\d{4}-\d{2}-\d{2}$/;
function cleanDay(v){
  if (!v || typeof v !== 'object') return null;
  const o = {};
  DAY_FIELDS.forEach(f => {
    let x = v[f];
    if (x === true) x = 1;
    if (typeof x !== 'number' || !isFinite(x)) return;
    o[f] = f === 'km' ? Math.max(0, Math.min(99, x)) : (f === 'u' ? Math.max(0, Math.floor(x)) : (x ? 1 : 0));
  });
  return Object.keys(o).length ? o : null;
}
function mergeInto(base, extra){
  if (!extra || typeof extra !== 'object' || !extra.days || typeof extra.days !== 'object') return base;
  Object.keys(extra.days).forEach(k => {
    if (!KEY_RE.test(k)) return;
    const b = cleanDay(extra.days[k]);
    if (!b) return;
    const a = base.days[k];
    if (!a || (b.u || 0) > (a.u || 0)) base.days[k] = b;
  });
  return base;
}
function readEmbedded(){
  try {
    const o = JSON.parse(document.getElementById('log').textContent);
    return (o && typeof o.days === 'object') ? o : null;
  } catch(e){ return null; }
}
/* 저장 필요 여부 판단용 정규형 — 키 정렬 + 필드 정제로 순서 차이를 없앤다 */
function canonDays(days){
  const out = {};
  Object.keys(days || {}).filter(k => KEY_RE.test(k)).sort().forEach(k => {
    const d = cleanDay(days[k]);
    if (d) out[k] = d;
  });
  return JSON.stringify(out);
}
function stashUI(){ try { sessionStorage.setItem(UI_KEY, JSON.stringify({ tab:viewTab, sel:selKey, y:calY, m:calM })); } catch(e){} }
function restoreUI(){
  try {
    const u = JSON.parse(sessionStorage.getItem(UI_KEY));
    sessionStorage.removeItem(UI_KEY);
    if (u && u.tab === 'cal'){
      viewTab = 'cal';
      selKey = (typeof u.sel === 'string' && KEY_RE.test(u.sel)) ? u.sel : null;
      if (typeof u.y === 'number' && typeof u.m === 'number' && u.m >= 0 && u.m <= 11){ calY = u.y; calM = u.m; }
    }
  } catch(e){}
}
function applyTab(){
  document.getElementById('tab-today').setAttribute('aria-selected', viewTab === 'today');
  document.getElementById('tab-cal').setAttribute('aria-selected', viewTab === 'cal');
  document.getElementById('view-today').hidden = viewTab !== 'today';
  document.getElementById('view-cal').hidden = viewTab !== 'cal';
}

/* ================= 아티팩트 저장 ================= */
const LOG_BLOCK_RE = /(<script type="application\/json" id="log">)[\s\S]*?(<\/script>)/;
function buildPage(){
  const json = JSON.stringify(S).replace(/</g, '\\u003c');
  const body = SRC0.replace(LOG_BLOCK_RE, (m, a, b) => a + json + b);
  return '<!doctype html>\n<html lang="ko"><head><meta charset="utf-8"></head><body>' + body + '\n</body></html>';
}
function scheduleSave(){
  if (!art || permanentLocal){ setStatus(permanentLocal ? localStatus : 'local'); return; }
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 2500);
}
async function doSave(retried){
  if (!art || permanentLocal){ setStatus(permanentLocal ? localStatus : 'local'); return; }
  if (!LOG_BLOCK_RE.test(SRC0)){ setStatus('error'); return; }   // 원본에 기록 블록이 없으면 덮어쓰기 금지
  writeSS();   // 저장 후 뷰가 리로드되므로 스태시 + 화면 상태 보존
  stashUI();
  try {
    await art.publish(buildPage());   // 성공하면 이 보기는 새 버전으로 리로드된다
    clearSS();
    conflictRetried = false;
    setStatus('synced');
  } catch(e){
    const code = e && e.code;
    if (code === 'conflict'){ setStatus('conflict'); return; }   // 셸이 최신 버전으로 리로드, 스태시는 리로드 후 병합됨
    if (code === 'rate_limited'){ clearTimeout(retryTimer); retryTimer = setTimeout(() => doSave(), 6000); return; }
    if (code === 'upstream_error' && !retried){ clearTimeout(retryTimer); retryTimer = setTimeout(() => doSave(true), 2500); return; }
    if (code === 'not_writer'){ permanentLocal = true; localStatus = 'readonly'; setStatus('readonly'); return; }
    if (['capability_disabled','not_granted','not_declared','read_only_path','capability_removed','consent_required'].includes(code)){
      permanentLocal = true; localStatus = 'local'; setStatus('local'); return;
    }
    setStatus('error');
  }
}

/* ================= 도구: 내보내기/가져오기 ================= */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}
async function exportJSON(){
  const data = JSON.stringify(S, null, 2);
  if (downloadsNS){
    try { await downloadsNS.save({ filename:'ounwan-log.json', data }); toast('기록 파일을 저장했어요.'); return; }
    catch(e){ if (e && e.code === 'declined') return; }
  }
  copyJSON();
}
async function copyJSON(){
  const data = JSON.stringify(S);
  try { await navigator.clipboard.writeText(data); toast('기록 JSON을 복사했어요.'); }
  catch(e){ toast('복사할 수 없어요. "파일로 내보내기"를 사용해 주세요.'); }
}
function importJSON(file){
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      if (!obj || typeof obj.days !== 'object') throw 0;
      mergeInto(S, obj);
      writeLS(); scheduleSave(); render();
      toast('기록을 합쳤어요.');
    } catch(e){ toast('올바른 기록 파일이 아니에요.'); }
  };
  rd.readAsText(file);
}

/* ================= 이벤트 ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'toggle'){
    const k = el.dataset.date, id = el.dataset.id;
    if (k > todayKey()) return;
    setDay(k, { [id]: day(k)[id] ? 0 : 1 });
  }
  else if (act === 'tab'){
    viewTab = el.dataset.tab;
    applyTab();
    if (viewTab === 'cal' && !selKey) selKey = todayKey();
    render();
    window.scrollTo({ top:0 });
  }
  else if (act === 'pick'){
    const k = el.dataset.date;
    if (k > todayKey()) { toast('아직 오지 않은 날이에요.'); return; }
    selKey = (selKey === k) ? null : k;
    renderCal();
  }
  else if (act === 'mon'){
    calM += +el.dataset.dir;
    if (calM < 0){ calM = 11; calY--; }
    if (calM > 11){ calM = 0; calY++; }
    renderCal();
  }
  else if (act === 'export') exportJSON();
  else if (act === 'copy') copyJSON();
  else if (act === 'import') document.getElementById('importfile').click();
  else if (act === 'reset'){
    if (confirm('정말 모든 기록을 삭제할까요? 되돌릴 수 없습니다.')){
      S = { version:1, days:{} };
      writeLS(); scheduleSave(); render();
    }
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && e.target.matches('.row[data-act="toggle"]')){
    e.preventDefault(); e.target.click();
  }
});
document.addEventListener('change', e => {
  if (e.target.matches('[data-act="km"]')){
    const v = Math.max(0, Math.min(99, parseFloat(e.target.value) || 0));
    const k = e.target.dataset.date;
    setDay(k, { km: v, c1: v > 0 ? 1 : day(k).c1 });
  }
  if (e.target.id === 'importfile' && e.target.files[0]){
    importJSON(e.target.files[0]); e.target.value = '';
  }
});
/* ================= 초기화 ================= */
/* 기록의 원본은 페이지에 내장된 #log 블록. localStorage(이 기기 캐시)와
   sessionStorage(저장 도중 리로드 대비 스태시)를 날짜별 u(수정시각)로 병합한다. */
(function initSync(){
  const now = new Date();
  calY = now.getFullYear(); calM = now.getMonth();
  const emb = readEmbedded();
  if (emb) mergeInto(S, emb);
  const local = readLS();
  if (local) mergeInto(S, local);
  const stash = readSS();
  if (stash) mergeInto(S, stash);   // 스태시는 동기화 확인 후에만 지운다
  restoreUI();
  applyTab();
  setStatus('boot');
  render();
})();
(async function initAsync(){
  try {
    if (window.claude && typeof window.claude.use === 'function'){
      art = await window.claude.use('artifact');
      downloadsNS = await window.claude.use('downloads');
    }
  } catch(e){ art = null; }
  if (!art){ permanentLocal = true; localStatus = 'local'; setStatus('local'); return; }

  // 구버전이 쓰던 data/log.json 기록이 남아 있으면 한 번 합쳐 온다 (마이그레이션)
  let legacy = null;
  try {
    const r = await fetch('data/log.json', { cache:'no-store' });
    if (r.ok) legacy = await r.json();
  } catch(e){}
  const before = JSON.stringify(S.days);
  if (legacy) mergeInto(S, legacy);
  writeLS();
  if (JSON.stringify(S.days) !== before) render();

  // 페이지에 내장된 기록과 다르면 저장해서 내장본을 최신으로 만든다
  const emb = readEmbedded();
  if (canonDays(emb && emb.days) !== canonDays(S.days)) scheduleSave();
  else { clearSS(); setStatus('synced'); }
})();
</script>
