/* ---------- 토큰: 라이트(기본) ---------- */
:root{
  color-scheme: light;
  --bg:#f4f3ef; --card:#fcfcfb; --card2:#efeee8;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --line:#e1e0d9; --line2:#c9c7bf;
  --cat-m:#eb6834; --cat-e:#4a3aa7; --cat-c:#1baf7a; --cat-n:#eda100;
  --on-m:#ffffff;  --on-e:#ffffff;  --on-c:#002a1c;  --on-n:#1c1500;
  --ok:#0ca30c; --warn:#b26a00; --err:#d03b3b;
  --stamp:#0b0b0b; --on-stamp:#fcfcfb;
  --ring:rgba(11,11,11,.10);
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 4px 14px rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f0f0e; --card:#1a1a19; --card2:#232322;
    --ink:#f4f4f0; --ink2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --line2:#3d3c38;
    --cat-m:#d95926; --cat-e:#9085e9; --cat-c:#199e70; --cat-n:#c98500;
    --on-m:#ffffff;  --on-e:#191338;  --on-c:#ffffff;  --on-n:#211600;
    --ok:#0ca30c; --warn:#fab219; --err:#e66767;
    --stamp:#f4f4f0; --on-stamp:#0f0f0e;
    --ring:rgba(255,255,255,.10);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f0f0e; --card:#1a1a19; --card2:#232322;
  --ink:#f4f4f0; --ink2:#c3c2b7; --muted:#898781;
  --line:#2c2c2a; --line2:#3d3c38;
  --cat-m:#d95926; --cat-e:#9085e9; --cat-c:#199e70; --cat-n:#c98500;
  --on-m:#ffffff;  --on-e:#191338;  --on-c:#ffffff;  --on-n:#211600;
  --ok:#0ca30c; --warn:#fab219; --err:#e66767;
  --stamp:#f4f4f0; --on-stamp:#0f0f0e;
  --ring:rgba(255,255,255,.10);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.25);
}

/* ---------- 기본 ---------- */
*{box-sizing:border-box; margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
.disp{font-family:"Black Han Sans","IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif; font-weight:400; letter-spacing:.01em}
.wrap{max-width:600px; margin:0 auto; padding:18px 16px calc(104px + env(safe-area-inset-bottom))}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
:focus-visible{outline:2px solid var(--cat-e); outline-offset:2px; border-radius:6px}

/* ---------- 헤더 ---------- */
.top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:4px}
.brand{font-size:12px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase}
.savechip{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink2); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:4px 10px; white-space:nowrap}
.savechip .dot{width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none}
.savechip[data-s="synced"] .dot{background:var(--ok)}
.savechip[data-s="saving"] .dot{background:var(--warn); animation:pulse 1.1s ease-in-out infinite}

<script>

const SECTIONS = [
  { key:'m', icon:'🌅', title:'아침 루틴', sub:'출근 전 3분 · 자세 정렬 & 펌핑', items:[

    { id:'e1', name:'8kg 원암 덤벨 로우 🥇', vol:'각 10~12회 × 3세트', sub:'광배근 · 등' },

  { key:'c', icon:'🏃', title:'슬로우 조깅', sub:'주 2~3회 · 3.0~4.0km · 25~35분', items:[
    { id:'c1', name:'슬로우 조깅', vol:'3.0~4.0km', sub:'Zone 2 · FatMax 유산소' },
  ]},
  { key:'n', icon:'🥗', title:'식단 체크', sub:'하루 영양 체크리스트', items:[
    { id:'n1', name:'아침 — 가벼운 자연식', vol:'', sub:'계란 1~2개 + 바나나/하루견과 + 올레샷 1스푼' },
    { id:'n2', name:'점심 — 일반식 밥 반 공기 + 단백질 음료 23g', vol:'', sub:'식후 50분 속보' },
    { id:'n3', name:'저녁 — 닭가슴살 샐러드 + 방울토마토 7개', vol:'', sub:'수면 중 체지방 연소 유도' },
  ]},
];
const STRENGTH = ['m1','m2','e1','e2','e3'];
const DIET = ['n1','n2','n3'];
const ITEM_NAME = {};
SECTIONS.forEach(s => s.items.forEach(it => ITEM_NAME[it.id] = it.name));
const CAT_LABEL = { m:'아침', e:'저녁', c:'조깅', n:'식단' };

/* ================= 상태 ================= */
let S = { version:1, days:{} };      // days[key] = {m1:1,…,c1:1,km:3.5,n1:1,…,u:ms}
let art = null;                       // artifact 네임스페이스
let downloadsNS = null;
let permanentLocal = false;           // 파일 저장이 불가능하다고 판명됨
let localStatus = 'local';            // permanentLocal일 때 표시할 상태
let conflictRetried = false;
let saveTimer = null, retryTimer = null;

let calY, calM;                       // 캘린더에서 보고 있는 연/월
let selKey = null;                    // 캘린더에서 선택한 날

const LS_KEY = 'ounwan_v1';
const SS_KEY = 'ounwan_pending_v1';
const UI_KEY = 'ounwan_ui_v1';

/* ================= 날짜 유틸 ================= */
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const todayKey = () => keyOf(new Date());
const isWeekend = k => { const w = parseKey(k).getDay(); return w === 0 || w === 6; };
const DOW_KO = ['일','월','화','수','목','금','토'];

/* ================= 기록 접근 ================= */
const day = k => S.days[k] || {};
function dayDone(k){
  const d = day(k);
  return {
    m: !!(d.m1 && d.m2), mAny: !!(d.m1 || d.m2),
    e: !!(d.e1 && d.e2 && d.e3), eAny: !!(d.e1 || d.e2 || d.e3),
    c: !!d.c1,
    n: DIET.every(id => d[id]), nAny: DIET.some(id => d[id]),
    nCnt: DIET.filter(id => d[id]).length,
    strength: STRENGTH.every(id => d[id]),
    any: STRENGTH.some(id => d[id]) || !!d.c1 || DIET.some(id => d[id]),
  };
}
/* 그날의 훈련 목표 달성: 평일=근력 5종, 주말=조깅(휴식일 보너스) */
const isComplete = k => isWeekend(k) ? dayDone(k).c : dayDone(k).strength;

function setDay(k, patch){
  const cleaned = cleanDay({ ...day(k), ...patch, u: Date.now() });
  const hasContent = cleaned && (STRENGTH.concat(DIET, ['c1']).some(id => cleaned[id]) || cleaned.km > 0);
  if (!hasContent) delete S.days[k]; else S.days[k] = cleaned;
  writeLS();
  scheduleSave();
  render();
}

/* ================= 통계 ================= */
function streak(){
  const d = new Date(); let n = 0, guard = 0;
  if (!isComplete(keyOf(d))) d.setDate(d.getDate()-1);   // 오늘 미완료면 어제부터
  while (guard++ < 400){
    const k = keyOf(d), w = d.getDay();
    if (w === 0 || w === 6){                              // 주말: 스트릭 유지(카운트 제외)
      d.setDate(d.getDate()-1); continue;
    }
    if (isComplete(k)) { n++; d.setDate(d.getDate()-1); }
    else break;
  }
  return n;
}
function weekCardio(){
  const now = new Date();
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay()+6)%7));
  let cnt = 0, km = 0;
  for (let i=0;i<7;i++){
    const d = new Date(mon); d.setDate(mon.getDate()+i);
    const rec = day(keyOf(d));
    if (rec.c1){ cnt++; km += (+rec.km || 0); }
  }
  return { cnt, km };
}
function monthStats(y, m){
  let train = 0, jog = 0, jogKm = 0;
  const last = new Date(y, m+1, 0).getDate();
  for (let dd=1; dd<=last; dd++){
    const k = y + '-' + pad(m+1) + '-' + pad(dd);
    if (!isWeekend(k) && dayDone(k).strength) train++;
    if (day(k).c1){ jog++; jogKm += (+day(k).km || 0); }
  }
  return { train, jog, jogKm };
}

/* ================= 구글 캘린더 링크 ================= */
function gcalUrl(k){
  const d = day(k), st = dayDone(k);
  const parts = [];
  if (st.m) parts.push('아침'); if (st.e) parts.push('저녁');
  if (st.c) parts.push('조깅' + (d.km > 0 ? ' ' + d.km + 'km' : ''));
  if (st.nCnt) parts.push('식단 ' + st.nCnt + '/' + DIET.length);
  const title = '💪 오운완 — ' + (parts.length ? parts.join(' · ') : '운동 기록');
  const lines = ['[오운완 체크 · 훈련 일지]', ''];
  SECTIONS.forEach(s => {
    lines.push(s.icon + ' ' + s.title);
    s.items.forEach(it => {
      let line = (d[it.id] ? '✅ ' : '⬜ ') + it.name;
      if (it.id === 'c1' && d.km > 0) line += ' (' + d.km + 'km)';
      lines.push(line);
    });
    lines.push('');
  });
  lines.push('🔥 연속 달성 ' + streak() + '일');
  const next = parseKey(k); next.setDate(next.getDate()+1);
  const dates = k.replace(/-/g,'') + '/' + keyOf(next).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(title)
    + '&dates=' + dates
    + '&details=' + encodeURIComponent(lines.join('\n'));
}

/* ================= 렌더 ================= */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function rowHTML(k, it, cat, disabled){
  const checked = !!day(k)[it.id];

    + '<span class="row-main"><span class="row-name">' + esc(it.name) + '</span>'

    + (it.vol ? '<span class="row-vol">' + esc(it.vol) + '</span>' : '')
    + '</div>';
}

function sectionHTML(k, s, opts){

function calCellHTML(y, m, dd, tk){

  if (k === selKey) cls.push('sel');
  if (isComplete(k) && !future) cls.push('done');
  if (future) cls.push('future');
  const dot = (on, half, c) => '<i class="d-' + c + (on ? '' : half ? ' half' : ' off') + '"></i>';
  return '<button class="' + cls.join(' ') + '" data-act="pick" data-date="' + k + '"'
    + (future ? ' aria-disabled="true"' : '') + ' aria-label="' + m1label(k) + '">'
    + '<span class="c-num">' + dd + '</span>'
    + '<span class="c-dots">'
    + dot(st.m, st.mAny, 'm') + dot(st.e, st.eAny, 'e') + dot(st.c, false, 'c') + dot(st.n, st.nAny, 'n')
    + '</span></button>';
}

/* ================= 로컬/세션 스토리지 ================= */
function readLS(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch(e){ return null; } }
function writeLS(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e){} }
function readSS(){ try { return JSON.parse(sessionStorage.getItem(SS_KEY)) || null; } catch(e){ return null; } }
function writeSS(){ try { sessionStorage.setItem(SS_KEY, JSON.stringify(S)); } catch(e){} }
function clearSS(){ try { sessionStorage.removeItem(SS_KEY); } catch(e){} }

/* 병합 시 필드 화이트리스트로 정제한다 — 외부에서 가져온 JSON이
   페이지에 내장되므로 임의 문자열이 흘러들지 않게 한다. */
const DAY_FIELDS = ['m1','m2','e1','e2','e3','c1','n1','n2','n3','n4','km','u'];
const KEY_RE = /^\d{4}-\d{2}-\d{2}$/;
function cleanDay(v){
  if (!v || typeof v !== 'object') return null;
  const o = {};
  DAY_FIELDS.forEach(f => {
    let x = v[f];
    if (x === true) x = 1;
    if (typeof x !== 'number' || !isFinite(x)) return;
    o[f] = f === 'km' ? Math.max(0, Math.min(99, x)) : (f === 'u' ? Math.max(0, Math.floor(x)) : (x ? 1 : 0));
  });
  return Object.keys(o).length ? o : null;
}
function mergeInto(base, extra){
  if (!extra || typeof extra !== 'object' || !extra.days || typeof extra.days !== 'object') return base;
  Object.keys(extra.days).forEach(k => {
    if (!KEY_RE.test(k)) return;
    const b = cleanDay(extra.days[k]);
    if (!b) return;
    const a = base.days[k];
    if (!a || (b.u || 0) > (a.u || 0)) base.days[k] = b;
  });
  return base;
}
function readEmbedded(){
  try {
    const o = JSON.parse(document.getElementById('log').textContent);
    return (o && typeof o.days === 'object') ? o : null;
  } catch(e){ return null; }
}
/* 저장 필요 여부 판단용 정규형 — 키 정렬 + 필드 정제로 순서 차이를 없앤다 */
function canonDays(days){
  const out = {};
  Object.keys(days || {}).filter(k => KEY_RE.test(k)).sort().forEach(k => {
    const d = cleanDay(days[k]);
    if (d) out[k] = d;
  });
  return JSON.stringify(out);
}
function stashUI(){ try { sessionStorage.setItem(UI_KEY, JSON.stringify({ tab:viewTab, sel:selKey, y:calY, m:calM })); } catch(e){} }
function restoreUI(){
  try {
    const u = JSON.parse(sessionStorage.getItem(UI_KEY));
    sessionStorage.removeItem(UI_KEY);
    if (u && u.tab === 'cal'){
      viewTab = 'cal';
      selKey = (typeof u.sel === 'string' && KEY_RE.test(u.sel)) ? u.sel : null;
      if (typeof u.y === 'number' && typeof u.m === 'number' && u.m >= 0 && u.m <= 11){ calY = u.y; calM = u.m; }
    }
  } catch(e){}
}
function applyTab(){
  document.getElementById('tab-today').setAttribute('aria-selected', viewTab === 'today');
  document.getElementById('tab-cal').setAttribute('aria-selected', viewTab === 'cal');
  document.getElementById('view-today').hidden = viewTab !== 'today';
  document.getElementById('view-cal').hidden = viewTab !== 'cal';
}

/* ================= 아티팩트 저장 ================= */
const LOG_BLOCK_RE = /(<script type="application\/json" id="log">)[\s\S]*?(<\/script>)/;
function buildPage(){
  const json = JSON.stringify(S).replace(/</g, '\\u003c');
  const body = SRC0.replace(LOG_BLOCK_RE, (m, a, b) => a + json + b);
  return '<!doctype html>\n<html lang="ko"><head><meta charset="utf-8"></head><body>' + body + '\n</body></html>';
}
function scheduleSave(){
  if (!art || permanentLocal){ setStatus(permanentLocal ? localStatus : 'local'); return; }
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 2500);
}
async function doSave(retried){
  if (!art || permanentLocal){ setStatus(permanentLocal ? localStatus : 'local'); return; }
  if (!LOG_BLOCK_RE.test(SRC0)){ setStatus('error'); return; }   // 원본에 기록 블록이 없으면 덮어쓰기 금지
  writeSS();   // 저장 후 뷰가 리로드되므로 스태시 + 화면 상태 보존
  stashUI();
  try {
    await art.publish(buildPage());   // 성공하면 이 보기는 새 버전으로 리로드된다
    clearSS();
    conflictRetried = false;
    setStatus('synced');
  } catch(e){
    const code = e && e.code;
    if (code === 'conflict'){ setStatus('conflict'); return; }   // 셸이 최신 버전으로 리로드, 스태시는 리로드 후 병합됨
    if (code === 'rate_limited'){ clearTimeout(retryTimer); retryTimer = setTimeout(() => doSave(), 6000); return; }
    if (code === 'upstream_error' && !retried){ clearTimeout(retryTimer); retryTimer = setTimeout(() => doSave(true), 2500); return; }
    if (code === 'not_writer'){ permanentLocal = true; localStatus = 'readonly'; setStatus('readonly'); return; }
    if (['capability_disabled','not_granted','not_declared','read_only_path','capability_removed','consent_required'].includes(code)){
      permanentLocal = true; localStatus = 'local'; setStatus('local'); return;
    }
    setStatus('error');
  }
}

/* ================= 도구: 내보내기/가져오기 ================= */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2600);
}
async function exportJSON(){
  const data = JSON.stringify(S, null, 2);
  if (downloadsNS){
    try { await downloadsNS.save({ filename:'ounwan-log.json', data }); toast('기록 파일을 저장했어요.'); return; }
    catch(e){ if (e && e.code === 'declined') return; }
  }
  copyJSON();
}
async function copyJSON(){
  const data = JSON.stringify(S);
  try { await navigator.clipboard.writeText(data); toast('기록 JSON을 복사했어요.'); }
  catch(e){ toast('복사할 수 없어요. "파일로 내보내기"를 사용해 주세요.'); }
}
function importJSON(file){
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      if (!obj || typeof obj.days !== 'object') throw 0;
      mergeInto(S, obj);
      writeLS(); scheduleSave(); render();
      toast('기록을 합쳤어요.');
    } catch(e){ toast('올바른 기록 파일이 아니에요.'); }
  };
  rd.readAsText(file);
}

/* ================= 이벤트 ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'toggle'){
    const k = el.dataset.date, id = el.dataset.id;
    if (k > todayKey()) return;
    setDay(k, { [id]: day(k)[id] ? 0 : 1 });
  }
  else if (act === 'tab'){
    viewTab = el.dataset.tab;
    applyTab();
    if (viewTab === 'cal' && !selKey) selKey = todayKey();
    render();
    window.scrollTo({ top:0 });
  }
  else if (act === 'pick'){
    const k = el.dataset.date;
    if (k > todayKey()) { toast('아직 오지 않은 날이에요.'); return; }
    selKey = (selKey === k) ? null : k;
    renderCal();
  }
  else if (act === 'mon'){
    calM += +el.dataset.dir;
    if (calM < 0){ calM = 11; calY--; }
    if (calM > 11){ calM = 0; calY++; }
    renderCal();
  }
  else if (act === 'export') exportJSON();
  else if (act === 'copy') copyJSON();
  else if (act === 'import') document.getElementById('importfile').click();
  else if (act === 'reset'){
    if (confirm('정말 모든 기록을 삭제할까요? 되돌릴 수 없습니다.')){
      S = { version:1, days:{} };
      writeLS(); scheduleSave(); render();
    }
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && e.target.matches('.row[data-act="toggle"]')){
    e.preventDefault(); e.target.click();
  }
});
document.addEventListener('change', e => {

    const k = e.target.dataset.date;

});
/* ================= 초기화 ================= */
/* 기록의 원본은 페이지에 내장된 #log 블록. localStorage(이 기기 캐시)와
   sessionStorage(저장 도중 리로드 대비 스태시)를 날짜별 u(수정시각)로 병합한다. */
(function initSync(){
  const now = new Date();
  calY = now.getFullYear(); calM = now.getMonth();
  const emb = readEmbedded();
  if (emb) mergeInto(S, emb);
  const local = readLS();
  if (local) mergeInto(S, local);
  const stash = readSS();
  if (stash) mergeInto(S, stash);   // 스태시는 동기화 확인 후에만 지운다
  restoreUI();
  applyTab();
  setStatus('boot');
  render();
})();
(async function initAsync(){
  try {
    if (window.claude && typeof window.claude.use === 'function'){
      art = await window.claude.use('artifact');
      downloadsNS = await window.claude.use('downloads');
    }
  } catch(e){ art = null; }
  if (!art){ permanentLocal = true; localStatus = 'local'; setStatus('local'); return; }

  // 구버전이 쓰던 data/log.json 기록이 남아 있으면 한 번 합쳐 온다 (마이그레이션)
  let legacy = null;
  try {
    const r = await fetch('data/log.json', { cache:'no-store' });
    if (r.ok) legacy = await r.json();
  } catch(e){}
  const before = JSON.stringify(S.days);
  if (legacy) mergeInto(S, legacy);
  writeLS();
  if (JSON.stringify(S.days) !== before) render();

  // 페이지에 내장된 기록과 다르면 저장해서 내장본을 최신으로 만든다
  const emb = readEmbedded();
  if (canonDays(emb && emb.days) !== canonDays(S.days)) scheduleSave();
  else { clearSS(); setStatus('synced'); }
})();
</script>
